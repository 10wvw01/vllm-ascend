<text x="593" y="758" fill="#19354F" font-size="17" font-weight="450" text-anchor="start">单件 SQE 取证</text>
<text x="593" y="789" fill="#19354F" font-size="17" font-weight="450" text-anchor="start">P0 推进</text>
