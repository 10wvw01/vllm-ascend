<text x="65" y="936" fill="#1A5EA8" font-size="21" font-weight="700" text-anchor="start">我：技术方案与正式代码</text>
<text x="65" y="969" fill="#19354F" font-size="18" font-weight="450" text-anchor="start">审查证据、实现优化、两轮静态评审</text>
<rect x="488" y="902" width="422" height="120" rx="14" fill="#F2F5F8" stroke="#CAD9E8" stroke-width="2"/>
<text x="508" y="936" fill="#1A5EA8" font-size="21" font-weight="700" text-anchor="start">OpenCode：310P3 实机</text>
<text x="508" y="969" fill="#19354F" font-size="18" font-weight="450" text-anchor="start">编译、位精确、Profiler、日志与回归</text>
