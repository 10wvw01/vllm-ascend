<text x="330" y="508" fill="#133858" font-size="22" font-weight="700" text-anchor="start">42</text>
<text x="560" y="508" fill="#16794C" font-size="22" font-weight="700" text-anchor="start">21</text>
<text x="765" y="508" fill="#133858" font-size="22" font-weight="700" text-anchor="start">13</text>
<text x="975" y="508" fill="#133858" font-size="22" font-weight="700" text-anchor="start">2</text>
<text x="1158" y="508" fill="#BC3A3E" font-size="22" font-weight="700" text-anchor="start">6</text>
<rect x="45" y="548" width="1310" height="67" rx="14" fill="#FFF8E5" stroke="#E6CA85" stroke-width="2"/>
<text x="75" y="589" fill="#9E6B0B" font-size="21" font-weight="700" text-anchor="start">重要：50% 是“指定排查任务完成率”，不是“已经解决一半性能和稳定性问题”。</text>
<text x="45" y="667" fill="#133858" font-size="25" font-weight="700" text-anchor="start">后续里程碑：哪些可并行，哪些必须等待上一步</text>
