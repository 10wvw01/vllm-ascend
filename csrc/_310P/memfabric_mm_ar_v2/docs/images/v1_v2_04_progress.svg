<text x="857" y="789" fill="#19354F" font-size="17" font-weight="450" text-anchor="start">待根因</text>
<path d="M1084 763 L1099 763" fill="none" stroke="#1A5EA8" stroke-width="3" marker-end="url(#arrow)"/>
