<text x="560" y="354" fill="#526B80" font-size="19" font-weight="700" text-anchor="start">已完成</text>
<text x="765" y="354" fill="#526B80" font-size="19" font-weight="700" text-anchor="start">部分取证</text>
<text x="975" y="354" fill="#526B80" font-size="19" font-weight="700" text-anchor="start">实机在途</text>
<text x="1158" y="354" fill="#526B80" font-size="19" font-weight="700" text-anchor="start">未完成</text>
