<title>V1/V2 性能与稳定性排障图解</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1A5EA8"/></marker></defs>
<rect x="0" y="0" width="1400" height="1135" fill="#FBFCFE"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="12" y="12" width="1376" height="80" rx="20" fill="#133858" stroke="#133858" stroke-width="2"/>
<text x="42" y="64" fill="#FFFFFF" font-size="32" font-weight="700" text-anchor="start">图解四：排障进度与下一步谁做什么</text>
