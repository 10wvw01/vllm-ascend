<text x="743" y="187" fill="#19354F" font-size="18" font-weight="450" text-anchor="start">V2 目前尚未赢 Stock</text>
<rect x="1062" y="120" width="295" height="128" rx="14" fill="#FFF0F0" stroke="#BC3A3E" stroke-width="2"/>
<text x="1082" y="154" fill="#BC3A3E" font-size="22" font-weight="700" text-anchor="start">Gate E 稳定性</text>
<text x="1082" y="187" fill="#19354F" font-size="18" font-weight="450" text-anchor="start">507014 P0 未关闭</text>
<text x="45" y="297" fill="#133858" font-size="25" font-weight="700" text-anchor="start">42 项排障任务：当前阶段完成 21 项，剩余仍要进一步排查或验证</text>
<rect x="45" y="316" width="1310" height="215" rx="14" fill="#FFFFFF" stroke="#CAD9E8" stroke-width="2"/>
<text x="95" y="354" fill="#526B80" font-size="19" font-weight="700" text-anchor="start">主线</text>
