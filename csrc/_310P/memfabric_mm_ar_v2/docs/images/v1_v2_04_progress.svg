<text x="65" y="187" fill="#19354F" font-size="18" font-weight="450" text-anchor="start">指定范围已验证</text>
<rect x="384" y="120" width="295" height="128" rx="14" fill="#FFF8E5" stroke="#9E6B0B" stroke-width="2"/>
